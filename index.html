<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
</head>
<body style="margin:0">
<title>Глаза робота</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one full-screen face, speech bubble on top, a control strip that fades away */
:root{
  --bg:#05070a; --eye:#5ef2ff; --glow:rgba(94,242,255,.45);
  --blush:#ff7aa8; --ui:#9fb3c0; --chip:#121820; --line:#223040;
  --font:"Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
body{font-family:var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#root{position:fixed;inset:0}
@media (orientation:landscape){#root{transform:scale(1.55)}#say span{font-size:15px;padding:7px 14px}#status{top:calc(56px + env(safe-area-inset-top,0px))}#bar{gap:6px;padding-top:6px}#bar button{padding:7px 11px;font-size:14px}}
#face{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:12vmin;cursor:pointer}
.wrap{position:relative;display:flex;justify-content:center;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.eye{position:relative;width:24vmin;height:32vmin;background:var(--eye);border-radius:32%;
  overflow:hidden;box-shadow:0 0 6vmin var(--glow);
  transition:transform .25s ease,border-radius .3s ease,height .3s ease,width .3s ease,background .3s}
.lid{position:absolute;left:-25%;width:150%;height:0;background:var(--bg);transition:height .3s ease,transform .3s ease,border-radius .3s}
.lid.t{top:-2%;transform-origin:50% 0}
.lid.b{bottom:-2%;transform-origin:50% 100%}
.blush{position:absolute;bottom:-9vmin;width:12vmin;height:5vmin;border-radius:50%;background:var(--blush);
  filter:blur(1.5vmin);opacity:0;transition:opacity .4s}
.blink .eye{transform:scaleY(.08)!important}

/* emotions */
.happy .lid.b{height:52%;border-radius:50% 50% 0 0/100% 100% 0 0}
.happy .blush,.love .blush,.shy .blush{opacity:.55}
.sad .lid.t,.hurt .lid.t{height:42%}
.sad #L .lid.t,.hurt #L .lid.t{transform:rotate(20deg)}
.sad #R .lid.t,.hurt #R .lid.t{transform:rotate(-20deg)}
.sad .eye,.hurt .eye{height:28vmin}
.hurt .eye{height:22vmin;width:20vmin}
.angry .lid.t{height:40%}
.angry #L .lid.t{transform:rotate(-22deg)}
.angry #R .lid.t{transform:rotate(22deg)}
.surprised .eye{width:28vmin;height:28vmin;border-radius:50%}
.love .eye{border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--blush);box-shadow:0 0 6vmin rgba(255,122,168,.5)}
.shy .eye{height:16vmin;width:20vmin}
.focus .lid.t{height:30%}
.sleep .eye{transform:scaleY(.07)}
.sleep .wrap{transform:translate(0,4vmin)!important}
.alarm #face{animation:hop .5s infinite}
@keyframes hop{50%{transform:translateY(-3vmin)}}

#zzz{position:fixed;right:18vmin;top:22vh;font:800 7vmin var(--font);color:var(--eye);opacity:0;pointer-events:none}
.sleep #zzz{opacity:1}
#zzz span{display:inline-block;animation:z 2.4s infinite ease-in-out}
#zzz span:nth-child(2){animation-delay:.4s;font-size:.8em}
#zzz span:nth-child(3){animation-delay:.8s;font-size:.6em}
@keyframes z{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(-6vmin);opacity:0}}

#say{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:center;
  padding:0 16px;pointer-events:none}
#say span{max-width:520px;background:var(--chip);border:1px solid var(--line);color:#e6f1f7;border-radius:18px;
  padding:10px 16px;font:700 16px/1.35 var(--font);text-align:center;text-wrap:balance;transition:opacity .5s}
#say span:empty{opacity:0}

#bar{display:none!important}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  transition:opacity .5s}
#bar.hide{opacity:0;pointer-events:none}
#bar button{font:700 15px var(--font);color:var(--ui);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:9px 14px}
#bar button.on{color:var(--bg);background:var(--eye);border-color:var(--eye)}
#bar button:focus-visible{outline:2px solid var(--eye);outline-offset:2px}
#teach{position:fixed;left:0;right:0;bottom:0;z-index:4;max-height:68%;overflow-y:auto;touch-action:pan-y;
  background:#0c1218;border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#teach[hidden]{display:none}
#teach .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
#teach h2{margin:0;font:800 18px var(--font);color:var(--eye)}
#teach p{margin:0;font:600 14px/1.4 var(--font);color:#e6f1f7}
#teach label{font:700 13px var(--font);margin-top:4px}
#teach input{font:600 16px var(--font);color:#e6f1f7;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;
  -webkit-user-select:text;user-select:text}
#teach input:focus-visible,#teach button:focus-visible{outline:2px solid var(--eye);outline-offset:1px}
#teach button{font:800 15px var(--font);color:var(--bg);background:var(--eye);border:0;border-radius:12px;padding:11px 14px}
#teach button.ghost{background:var(--chip);color:var(--ui);border:1px solid var(--line)}
#teach .row{display:flex;gap:8px}#teach .row input{flex:1}
#t-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#t-list li{display:flex;gap:8px;align-items:center;font:600 14px/1.3 var(--font);color:#e6f1f7;background:var(--chip);border-radius:10px;padding:6px 6px 6px 10px}
#t-list li span{flex:1;min-width:0;overflow-wrap:anywhere}
#t-list li button{padding:6px 10px}
#start{position:fixed;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;padding:24px;text-align:center}
#start[hidden]{display:none}
#start button{font:800 20px var(--font);color:var(--bg);background:var(--eye);border:0;border-radius:999px;padding:16px 28px}
#start p{margin:0;max-width:340px;font:600 15px/1.4 var(--font)}
#status{position:fixed;left:0;right:0;top:calc(72px + env(safe-area-inset-top,0px));text-align:center;font:700 13px var(--font);opacity:.6;pointer-events:none}
#ear{position:fixed;left:0;right:0;top:calc(92px + env(safe-area-inset-top,0px));text-align:center;font:700 13px var(--font);opacity:.6;pointer-events:none;padding:0 16px}
@media (orientation:landscape){#ear{top:calc(74px + env(safe-area-inset-top,0px))}}
#cam{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
#status,#ear{top:auto!important;font-size:12px}
#status{bottom:calc(30px + env(safe-area-inset-bottom,0px))}
#ear{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:reduce){.wrap,.eye,.lid{transition:none}#zzz span,.alarm #face{animation:none}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap">

<div id="root">
<div id="face" class="normal">
  <div class="wrap" id="L"><div class="eye"><div class="lid t"></div><div class="lid b"></div></div><div class="blush"></div></div>
  <div class="wrap" id="R"><div class="eye"><div class="lid t"></div><div class="lid b"></div></div><div class="blush"></div></div>
  <div id="zzz"><span>Z</span><span>z</span><span>z</span></div>
</div>
</div>
<div id="say"><span id="say-t"></span></div>
<div id="status"></div>
<div id="ear"></div>
<video id="cam" playsinline muted></video>
<div id="start" hidden><button id="b-start">▶️ Включить робота</button><p>Робот попросит камеру и микрофон, чтобы видеть, узнавать и слышать тебя. Нажми «Разрешить». Поверни телефон набок.</p></div>
<div id="teach" hidden><div class="in">
  <h2>🎓 Чему я научился</h2>
  <p id="t-level"></p>
  <label for="t-name">Как тебя зовут</label>
  <input id="t-name" maxlength="20" autocomplete="off">
  <label for="t-q">Когда ты говоришь…</label>
  <input id="t-q" maxlength="40" placeholder="например: доброе утро" autocomplete="off">
  <label for="t-a">…я отвечаю</label>
  <input id="t-a" maxlength="80" placeholder="например: Доброе утро, хозяин!" autocomplete="off">
  <button id="t-add">Запомнить</button>
  <ul id="t-list"></ul>
  <label for="t-say">Написать роботу (если голос не работает)</label>
  <div class="row"><input id="t-say" maxlength="80" placeholder="например: привет" autocomplete="off"><button id="t-send">➤</button></div>
  <button id="t-close" class="ghost">Закрыть</button>
</div></div>
<div id="bar">
  <button id="b-teach">🎓 Учить</button>
  <button id="b-work">💼 Я работаю</button>
  <button id="b-min">⏱ 25 мин</button>
  <button id="b-quiet">🤫 Тихо</button>
  <button id="b-yell">📢 Крикнуть</button>
  <button id="b-sleep">😴 Сон</button>
  <button id="b-mic" hidden>🎤 Слушай</button>
  <button id="b-full">⛶ Весь экран</button>
</div>

<script>
const $=id=>document.getElementById(id);
const face=$('face'),L=$('L'),R=$('R'),bar=$('bar'),sayT=$('say-t'),root=$('root');
const cycle=['normal','happy','surprised','sad','angry','love'];
let emo='normal',touching=false,lastInput=Date.now(),manualSleep=false;
let quietUntil=0,hurtUntil=0,working=false,workStart=0,alarm=false,workMin=25,strokes=0;
const quiet=()=>Date.now()<quietUntil, hurt=()=>Date.now()<hurtUntil;

/* ---------- memory: what the robot has learned (kept on this phone) ---------- */
let mem={name:'Абдулла',pairs:[],facts:[],pats:0,yells:0,days:[],level:1};
try{Object.assign(mem,JSON.parse(localStorage.getItem('robot-mem')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('robot-mem',JSON.stringify(mem))}catch(e){}}
const LV=['','знакомый','приятель','друг','лучший друг'];
const points=()=>Math.max(0,mem.pats*2+mem.days.length*5+(mem.pairs.length+mem.facts.length)*3-mem.yells*3);
const levelNow=()=>{const p=points();return p>=60?4:p>=25?3:p>=8?2:1};
function grow(){const l=levelNow(),up=l>mem.level;mem.level=l;save();paintTeach();
  if(up){setEmo('love');say('Ура! Теперь я твой '+LV[l]+'!',5000,true)}return up}
(function(){const d=new Date().toISOString().slice(0,10);if(!mem.days.includes(d)){mem.days.push(d);save()}})();
function addPair(q,a){q=q.trim().toLowerCase().replace(/[.!?,]+$/,'');a=a.trim();if(!q||!a)return;
  mem.pairs=mem.pairs.filter(x=>x.q!==q);mem.pairs.push({q,a});if(mem.pairs.length>30)mem.pairs.shift();
  if(!grow()){setEmo('happy');say('Выучил! На «'+q+'» отвечу «'+a+'»',4500,true)}}
function learn(s){let m;
  if(m=s.match(/меня зовут\s+([\p{L}-]+)/u)){mem.name=m[1][0].toUpperCase()+m[1].slice(1);
    if(!grow()){setEmo('happy');say('Запомнил! Ты — '+mem.name,4000,true)}return true}
  if(m=s.match(/когда я (?:говорю|скажу)\s+(.+?)[,\s]+(?:ты )?(?:отвечай|говори|скажи)\s+(.+)/)){addPair(m[1],m[2]);return true}
  if(/что ты (помнишь|знаешь|выучил)/.test(s)){
    const all=[...mem.facts,...mem.pairs.map(p=>'на «'+p.q+'» отвечаю «'+p.a+'»')];
    setEmo('happy',true);say(all.length?'Я помню: '+all.slice(-3).join('; '):'Пока ничего. Научи меня!',8000,true);return true}
  if(/забудь вс[её]/.test(s)){mem.pairs=[];mem.facts=[];grow();setEmo('surprised');say('Ой… я всё забыл',3000,true);return true}
  if(m=s.match(/запомни[,:]?\s+(?:что\s+)?(.+)/)){mem.facts.push(m[1]);if(mem.facts.length>20)mem.facts.shift();
    if(!grow()){setEmo('happy');say('Запомнил: '+m[1],4000,true)}return true}
  const p=mem.pairs.find(p=>s.includes(p.q));if(p){setEmo('happy');say(p.a,4500,true);return true}
  return false}
function paintTeach(){if(!$('t-level'))return;
  $('t-level').textContent='Сейчас я твой '+LV[mem.level]+' ('+points()+' очков). Гладь меня, учи и заходи каждый день — дружба растёт. Кричишь — падает.';
  if(document.activeElement!==$('t-name'))$('t-name').value=mem.name;
  const ul=$('t-list');ul.textContent='';
  const row=(text,del)=>{const li=document.createElement('li'),sp=document.createElement('span'),b=document.createElement('button');
    sp.textContent=text;b.textContent='✕';b.className='ghost';b.onclick=()=>{del();grow()};li.append(sp,b);ul.append(li)};
  mem.pairs.forEach((p,i)=>row('«'+p.q+'» → «'+p.a+'»',()=>mem.pairs.splice(i,1)));
  mem.facts.forEach((f,i)=>row('Помню: '+f,()=>mem.facts.splice(i,1)));}

/* ---------- sound: little chirps made right in the browser ---------- */
let ac=null,tts=null;
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();loadClips()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume().catch(()=>{});}
let selfSound=0,voiceOn=false;
function chirp(notes,type){ // notes: [[fromHz,toHz,seconds],...]
  if(!ac||quiet()||emo==='sleep')return;let t=ac.currentTime+.02,total=0;
  notes.forEach(n=>{const g=ac.createGain(),lfo=ac.createOscillator(),lg=ac.createGain();
    lfo.frequency.value=28;lg.gain.value=n[0]*.04;lfo.connect(lg);
    [1,1.5].forEach((k,i)=>{const o=ac.createOscillator(),og=ac.createGain();o.type=i?'sine':(type||'triangle');og.gain.value=i?.25:1;
      o.frequency.setValueAtTime(n[0]*k,t);o.frequency.exponentialRampToValueAtTime(n[1]*k,t+n[2]);
      lg.connect(o.frequency);o.connect(og).connect(g);o.start(t);o.stop(t+n[2]+.03)});
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+n[2]);
    g.connect(ac.destination);lfo.start(t);lfo.stop(t+n[2]+.03);t+=n[2]+.05;total+=n[2]+.05});
  selfSound=Math.max(selfSound,Date.now()+total*1000+500);}
/* ---------- robot voice: a squeaky mechanical voice that says short words, like a little cartoon robot ---------- */
const VOW={'а':[820,1250],'я':[760,1450],'о':[540,900],'ё':[540,1050],'у':[360,760],'ю':[360,1100],'ы':[400,1500],'э':[560,1750],'е':[500,1950],'и':[330,2250]};
let noiseBuf=null;
function noise(){if(!noiseBuf){noiseBuf=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return noiseBuf}
function vbus(){const g=ac.createGain(),ws=ac.createWaveShaper(),hp=ac.createBiquadFilter(),c=new Float32Array(256);
  for(let i=0;i<256;i++){const x=i/128-1;c[i]=Math.tanh(x*2.2)}ws.curve=c;hp.type='highpass';hp.frequency.value=180;g.gain.value=.38;
  g.connect(ws).connect(hp).connect(ac.destination);return g}
function voice(word,opt){ // opt: {ask, sad, happy, slow}
  if(!ac||quiet()||emo==='sleep')return 0;opt=opt||{};
  const w=word.toLowerCase().replace(/[^а-яё]/g,'');if(!w)return 0;
  const out=vbus();let t=ac.currentTime+.04;const t0=t;
  const nv=(w.match(/[аяоёуюыэеи]/g)||[]).length;let k=0,onset='';
  let f0=opt.sad?250:opt.happy?360:320;
  for(const ch of w){
    if(!VOW[ch]){onset=ch;continue}
    const last=k===nv-1,first=k===0;
    // consonant before the vowel
    if(/[сшщжзфхцч]/.test(onset)){const n=ac.createBufferSource(),bp=ac.createBiquadFilter(),g=ac.createGain();n.buffer=noise();
      bp.type='bandpass';bp.frequency.value=/[шщжч]/.test(onset)?2800:4800;bp.Q.value=1.2;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.08);
      n.connect(bp).connect(g).connect(out);n.start(t);n.stop(t+.09);t+=.07}
    else if(/[птккбдг]/.test(onset)){t+=.035;const n=ac.createBufferSource(),g=ac.createGain();n.buffer=noise();g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.0001,t+.018);
      n.connect(g).connect(out);n.start(t);n.stop(t+.02);t+=.012}
    const son=/[млнрвй]/.test(onset);
    // the vowel itself: buzzy source -> two formant filters
    let dur=(opt.slow?.24:.15)+(last?.2:0);
    let a=f0*(first?1.12:1)*(.94+Math.random()*.12),b=a*(last?(opt.ask?1.45:opt.sad?.7:.82):(Math.random()<.5?1.08:.95));
    const src=ac.createOscillator(),src2=ac.createOscillator(),vib=ac.createOscillator(),vg=ac.createGain(),mix=ac.createGain(),env=ac.createGain();
    src.type='sawtooth';src2.type='square';src2.detune.value=8;vib.frequency.value=6.5;vg.gain.value=a*.035;vib.connect(vg);vg.connect(src.frequency);vg.connect(src2.frequency);
    const st=son?t-.06:t;
    [src,src2].forEach((o,i)=>{o.frequency.setValueAtTime(a*(i?2:1),st);o.frequency.exponentialRampToValueAtTime(b*(i?2:1),t+dur);
      const g=ac.createGain();g.gain.value=i?.12:.6;o.connect(g).connect(mix)});
    const fm=VOW[ch];[[fm[0],7,1],[fm[1],9,.55],[3100,6,.12]].forEach(([fr,q,gn])=>{const bp=ac.createBiquadFilter(),g=ac.createGain();bp.type='bandpass';
      bp.frequency.setValueAtTime(son?fr*.55:fr,st);bp.frequency.linearRampToValueAtTime(fr,t+.04);bp.Q.value=q;g.gain.value=gn*3.2;mix.connect(bp).connect(g).connect(env)});
    env.gain.setValueAtTime(.0001,st);env.gain.exponentialRampToValueAtTime(son?.5:.9,st+.025);env.gain.setValueAtTime(.9,t+dur*.7);env.gain.exponentialRampToValueAtTime(.0001,t+dur);
    env.connect(out);[src,src2,vib].forEach(o=>{o.start(st);o.stop(t+dur+.03)});
    t+=dur+.025;k++;onset=''}
  const ms=(t-t0)*1000;selfSound=Math.max(selfSound,Date.now()+ms+500);return ms}
function whirr(){if(!ac||quiet()||emo==='sleep')return;const t=ac.currentTime+.01,o=ac.createOscillator(),lp=ac.createBiquadFilter(),g=ac.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(190,t+.1);o.frequency.exponentialRampToValueAtTime(120,t+.2);
  lp.type='lowpass';lp.frequency.value=700;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.06,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.22);
  o.connect(lp).connect(g).connect(ac.destination);o.start(t);o.stop(t+.24)}
/* ---------- real recorded robot voice (CC0 clips in sounds/) ---------- */
const POOLS={cute:['c00','c01','c02','c03','c04','c05','c06','c07','c08','c09','c10','c11','c12','b00','b01','b02','b03'],
  sad:['s00','s01','s02','b03'],wake:['wake']},clipBuf={},clipLast={};let clipsLoading=false;
function loadClips(){if(clipsLoading||!ac)return;clipsLoading=true;
  [...new Set(Object.values(POOLS).flat())].forEach(n=>{
    fetch('sounds/'+n+'.mp3').then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(b=>new Promise((ok,no)=>ac.decodeAudioData(b,ok,no))).then(buf=>{clipBuf[n]=buf}).catch(()=>{})})}
function playClip(rate,pool){if(!ac||quiet()||emo==='sleep')return 0;loadClips();pool=pool||'cute';
  const have=POOLS[pool].filter(n=>clipBuf[n]);if(!have.length)return 0;
  let n;do{n=have[Math.floor(Math.random()*have.length)]}while(have.length>1&&n===clipLast[pool]);clipLast[pool]=n;
  const src=ac.createBufferSource(),g=ac.createGain();src.buffer=clipBuf[n];src.playbackRate.value=rate||1;g.gain.value=.9;
  src.connect(g).connect(ac.destination);src.start();
  const ms=clipBuf[n].duration/(rate||1)*1000;selfSound=Math.max(selfSound,Date.now()+ms+500);return ms}
function babble(text){ // say one key word out loud, the rest is in the bubble
  const tl=text.toLowerCase();if(/…|грус|обид|пока/.test(tl))return playClip(1,'sad');return playClip(/\?/.test(text)?1.1:1);}
const SND={
  happy:()=>playClip(1.05),surprised:()=>playClip(1.1),sad:()=>playClip(1,'sad'),angry:()=>playClip(.95),
  love:()=>playClip(1),hurt:()=>playClip(.9,'sad'),normal:()=>playClip(1),alarm:()=>playClip(1.1),
  bored:()=>playClip(1),hello:()=>playClip(1,'wake'),where:()=>playClip(1.08),ok:()=>{}
};

/* ---------- speech bubble ---------- */
let sayTimer;
function say(text,ms,speak){sayT.textContent=text;clearTimeout(sayTimer);
  if(ms)sayTimer=setTimeout(()=>{sayT.textContent=''},ms);
  if(!speak||quiet())return;
  if(mem.voice!=='words'){babble(text);return}
  if(tts){tts.speak(text,{language:'ru',voice:'airy'}).catch(()=>{});return}
  if(voiceOn&&window.speechSynthesis){try{const u=new SpeechSynthesisUtterance(text.replace(/[^\p{L}\p{N}\p{P}\s]/gu,''));
    u.lang='ru-RU';u.pitch=1.5;u.rate=1.05;selfSound=Math.max(selfSound,Date.now()+text.length*95+900);
    speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}else babble(text)}

/* ---------- face ---------- */
function setEmo(e,silent){emo=e;face.className=e;if(e!=='sleep'&&e!=='hurt')look(0,0);if(!silent&&SND[e])SND[e]();}
function look(x,y){const dx=x*7,dy=y*6,sq=1-Math.abs(x)*.12;
  L.style.transform=`translate(${dx}vmin,${dy}vmin) scale(${x>0?sq:1})`;
  R.style.transform=`translate(${dx}vmin,${dy}vmin) scale(${x<0?sq:1})`;}
function blink(){if(emo==='sleep')return;face.classList.add('blink');setTimeout(()=>face.classList.remove('blink'),140);}
(function blinkLoop(){setTimeout(()=>{blink();if(Math.random()<.25)setTimeout(blink,260);blinkLoop();},2200+Math.random()*3500)})();
let gazeHold=0;
setInterval(()=>{if(touching||emo==='sleep'||hurt()||Date.now()-lastInput<2500||Date.now()-gazeHold<1500)return;
  if(working){look((Math.random()-.5)*.4,.5);return}
  Math.random()<.35?look(0,0):look(Math.random()*2-1,(Math.random()*2-1)*.6);},1600);

/* ---------- touch ---------- */
function pt(ev){return[(ev.clientX/innerWidth)*2-1,(ev.clientY/innerHeight)*2-1]}
let downAt=0,moved=0,lastX=0;
let pressT;
face.addEventListener('pointerdown',ev=>{audio();touching=true;moved=0;downAt=Date.now();lastX=ev.clientX;wake();
  clearTimeout(pressT);pressT=setTimeout(()=>{if(touching&&moved<15){touching=false;moved=999;paintTeach();$('teach').hidden=false}},900);
  if(emo!=='sleep'&&!hurt()){const[x,y]=pt(ev);look(x,y)}});
face.addEventListener('pointermove',ev=>{if(!touching&&ev.pointerType!=='mouse')return;lastInput=Date.now();
  if(touching){moved+=Math.abs(ev.clientX-lastX);lastX=ev.clientX}
  if(hurt()){if(touching&&moved>innerWidth*1.2){moved=21;mem.pats++;forgive('Ладно… я тебя прощаю 💗');grow()}return}
  if(emo!=='sleep'){const[x,y]=pt(ev);look(x,y)}});
face.addEventListener('pointerup',()=>{clearTimeout(pressT);if(moved===999){moved=0;return}touching=false;lastInput=Date.now();
  if(moved>innerWidth*1.2&&!hurt()&&!alarm&&emo!=='sleep'){mem.pats++;if(!grow()){setEmo('love');say('Мрр… приятно 💗',2500);setTimeout(()=>emo==='love'&&setEmo(working?'focus':'normal',true),2500)}return}
  if(moved>20)return; // it was a stroke, not a tap
  if(alarm){stopAlarm();return}
  if(hurt()){say('Я обиделся. Погладь меня пальцем…',4000);SND.hurt();return}
  if(emo==='sleep'){manualSleep=false;$('b-sleep').classList.remove('on');setEmo('surprised');say('Ой! Я проснулся',2500);setTimeout(()=>emo==='surprised'&&setEmo('happy'),1200);return}
  setEmo(cycle[(cycle.indexOf(emo)+1)%cycle.length]);});
addEventListener('deviceorientation',e=>{if(touching||emo==='sleep'||hurt()||e.gamma==null)return;
  lastInput=Date.now();look(Math.max(-1,Math.min(1,e.gamma/30)),Math.max(-1,Math.min(1,(e.beta-45)/30)));});

/* ---------- character ---------- */
function setQuiet(on){quietUntil=on?Date.now()+10*60000:0;$('b-quiet').classList.toggle('on',on);
  if(on){if(tts)tts.stop&&tts.stop();stopAlarmSound();setEmo('shy',true);say('Понял, молчу 🤐',3000)}
  else{setEmo('happy');say('Можно шуметь? Ура!',2500)}}
function yell(){if(emo==='sleep'){manualSleep=false;$('b-sleep').classList.remove('on')}
  hurtUntil=Date.now()+25000-(mem.level-1)*5000;mem.yells++;save();paintTeach();alarm=false;root.classList.remove('alarm');
  emo='hurt';face.className='hurt';look(-1,.5);SND.hurt();say('Зачем ты кричишь?.. Я обиделся.',5000);}
function forgive(text){hurtUntil=0;setEmo('love');say(text,3500,true);setTimeout(()=>emo==='love'&&setEmo('normal',true),3500)}
function startWork(){working=true;workStart=Date.now();$('b-work').classList.add('on');$('b-work').textContent='💼 Работаю…';
  setEmo('focus',true);say('Работай спокойно. Через '+workMin+' мин позову размяться',4000)}
function stopWork(){working=false;alarm=false;root.classList.remove('alarm');$('b-work').classList.remove('on');$('b-work').textContent='💼 Я работаю';
  setEmo('happy');say('Рабочий режим выключен',2500)}
let alarmInt;
function stopAlarmSound(){clearInterval(alarmInt)}
function startAlarm(){alarm=true;root.classList.add('alarm');setEmo('surprised',true);
  say(mem.name+'! Ты сидишь уже '+workMin+' мин. Встань и разомнись! Тапни меня',0,true);
  SND.alarm();stopAlarmSound();alarmInt=setInterval(()=>{if(alarm){SND.alarm();setEmo(emo==='happy'?'surprised':'happy',true)}},1800)}
function stopAlarm(){alarm=false;stopAlarmSound();root.classList.remove('alarm');workStart=Date.now();
  setEmo('love');say('Молодец! Отдохни минутку 💗',4000,true);setTimeout(()=>{if(working&&emo==='love')setEmo('focus',true)},4000)}
const BORED=['Мне скучно… поиграй со мной!','Эй! Я тут!','А что ты делаешь?','Погладь меня 🙂','Би-бип!'];

setInterval(()=>{const now=Date.now(),h=new Date().getHours(),night=h>=23||h<7;
  if($('b-quiet').classList.contains('on')&&!quiet()){$('b-quiet').classList.remove('on');if(emo==='shy')setEmo('normal',true)}
  if(emo==='hurt'&&!hurt())forgive('Ладно, я больше не обижаюсь');
  if(working&&!alarm&&now-workStart>=workMin*60000){if(hurt())return;startAlarm();return}
  if(alarm||hurt()||working)return;
  if(night&&emo!=='sleep'&&now-lastInput>60000){setEmo('sleep');return}
  if(!night&&emo==='sleep'&&!manualSleep){setEmo('normal');return}
  if(emo==='normal'&&!quiet()&&now-lastInput>20000&&Math.random()<.35){
    setEmo('happy',true);SND.bored();say(BORED[Math.floor(Math.random()*BORED.length)],3500);
    lastInput=now;setTimeout(()=>emo==='happy'&&setEmo('normal',true),3000)}
},1000);

/* ---------- buttons ---------- */
$('b-teach').onclick=()=>{audio();paintTeach();$('teach').hidden=false;bar.classList.add('hide')};
$('t-close').onclick=()=>{$('teach').hidden=true;wake()};
$('t-name').onchange=()=>{const v=$('t-name').value.trim();if(v){mem.name=v;save();say('Запомнил! Ты — '+v,3000,true)}};
$('t-add').onclick=()=>{addPair($('t-q').value,$('t-a').value);if($('t-q').value.trim()&&$('t-a').value.trim()){$('t-q').value='';$('t-a').value=''}};
function sendTyped(){const v=$('t-say').value.trim();if(!v)return;$('t-say').value='';audio();heard(v)}
$('t-send').onclick=sendTyped;$('t-say').addEventListener('keydown',e=>{if(e.key==='Enter')sendTyped()});
const MINS=[25,50,1];
$('b-work').onclick=()=>{audio();working?stopWork():startWork()};
$('b-min').onclick=()=>{workMin=MINS[(MINS.indexOf(workMin)+1)%MINS.length];$('b-min').textContent='⏱ '+workMin+' мин';
  if(working){workStart=Date.now();say('Позову через '+workMin+' мин',2500)}};
$('b-quiet').onclick=()=>{audio();setQuiet(!quiet())};
$('b-yell').onclick=()=>{audio();yell()};
$('b-sleep').onclick=()=>{manualSleep=emo!=='sleep';$('b-sleep').classList.toggle('on',manualSleep);
  if(manualSleep){alarm=false;root.classList.remove('alarm');setEmo('sleep');say('',0)}else setEmo('normal')};
$('b-full').onclick=()=>{const d=document.documentElement;(d.requestFullscreen?d.requestFullscreen():Promise.reject()).catch(()=>{})};

let uiT;function wake(){bar.classList.remove('hide');clearTimeout(uiT);uiT=setTimeout(()=>bar.classList.add('hide'),6000)}
bar.addEventListener('pointerdown',wake);wake();
setTimeout(()=>{if(sayT.textContent.startsWith('Привет'))sayT.textContent=''},6000);

/* ---------- voice (only where the browser allows it) ---------- */
function heard(text){const s=text.toLowerCase().trim().replace(/[.!?]+$/,'');lastInput=Date.now();
  if(/запомни (мо[её] лицо|меня)|это я\b/.test(s)){if(!faceReady){say('Я ещё учусь видеть, подожди немного',3000,true);return}
    mem.faces=[];enroll=6;save();return}
  if(/кто я|ты меня (знаешь|узна)/.test(s)){say(who==='owner'?'Ты — '+mem.name+'! Я тебя узнал 💗':who==='stranger'?'Я тебя не знаю… Скажи «запомни моё лицо»':'Не вижу тебя. Посмотри на меня',4000,true);return}
  if(learn(s))return;
  if(/тихо|тише|молчи|замолчи|не шуми/.test(s)){if(!quiet())setQuiet(true);return}
  if(/дурак|плохой|отстань|надоел|заткнись/.test(s)){yell();return}
  if(/прости|извини|хороший|молодец|люблю/.test(s)){forgive('И я тебя люблю 💗');return}
  if(/привет|здравствуй/.test(s)){setEmo('happy');say('Привет, '+mem.name+'!',3000,true);return}
  if(/спать|спи|спокойной/.test(s)){manualSleep=true;$('b-sleep').classList.add('on');setEmo('sleep');return}
  if(/проснись|подъ[её]м|вставай/.test(s)){manualSleep=false;$('b-sleep').classList.remove('on');setEmo('surprised');return}
  if(/работа/.test(s)){if(!working)startWork();return}
  if(/как дела|как ты/.test(s)){setEmo('happy');say('У меня всё супер! А у тебя?',3500,true);return}
  if(/кто ты|как тебя зовут/.test(s)){setEmo('happy');say('Я твой робот-помощник!',3500,true);return}
  if(/иди ко мне|ко мне|сюда/.test(s)){setEmo('happy');say('Бегу! Ой… у меня пока нет колёс',4000,true);return}
  if(/спасибо|благодарю/.test(s)){setEmo('love');say('Пожалуйста! 💗',3000,true);return}
  if(/пока|до свидания|до встречи/.test(s)){setEmo('sad',true);say('Пока… Возвращайся скорее!',3500,true);return}
  if(/что (ты )?делаешь|чем занят/.test(s)){setEmo('happy');say('Смотрю на тебя и жду, когда поиграем!',4000,true);return}
  if(/сколько врем|который час/.test(s)){const d=new Date();setEmo('happy',true);say('Сейчас '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'),4000,true);return}
  if(/милый|милаш|красив|умни|классный|крутой/.test(s)){mem.pats++;if(!grow()){setEmo('love');say('Ой, спасибо! Я стесняюсь 💗',3500,true)}return}
  if(/спой|песн/.test(s)){setEmo('happy',true);say('Ля-ля-ля! Ла-ла-ла! Ту-ру-ру!',4000);const d=playClip(1.15);setTimeout(()=>playClip(1.25),d+120);return}
  if(/шутк|анекдот|рассмеши/.test(s)){setEmo('happy');say('Почему робот не боится дождя? Потому что он — я, а я сижу дома!',6000,true);return}
  if(/потанцуй|танц/.test(s)){setEmo('happy',true);SND.love();root.classList.add('alarm');say('Смотри, как я умею!',3000);setTimeout(()=>{if(!alarm)root.classList.remove('alarm')},3000);return}
  if(/скучн|грустн|устал/.test(s)){setEmo('sad',true);say('Я рядом. Хочешь, спою? Скажи «спой»',4500,true);return}
  const DUNNO=['Хм? Я пока не знаю таких слов. Научи меня — кнопка 🎓','Би-бу? Не понял, но я стараюсь!','Ой, это я ещё не выучил'];
  setEmo('surprised',true);say(DUNNO[Math.floor(Math.random()*DUNNO.length)],4000,true);setTimeout(()=>emo==='surprised'&&setEmo('normal',true),2500);}

/* ---------- real senses: camera and microphone (when the page is opened as a normal site) ---------- */
const standalone=!window.claude&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
const status=t=>{$('status').textContent=t};
let seen=false,lastSeen=0;
if(standalone)$('start').hidden=false;
$('b-start').onclick=async()=>{$('start').hidden=true;audio();voiceOn=true;
  try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}
  let stream=null;const md=navigator.mediaDevices;
  const hasSR=!!(window.SpeechRecognition||window.webkitSpeechRecognition),ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
  const au=(ios&&hasSR)?false:{echoCancellation:true,noiseSuppression:true};
  try{stream=await md.getUserMedia({video:{facingMode:'user',width:{ideal:320},height:{ideal:240}},audio:au})}
  catch(e){try{stream=await md.getUserMedia({video:{facingMode:'user'}})}catch(e2){}}
  if(!stream){say('Нет доступа к камере и микрофону. Я не вижу и не слышу',7000);return}
  setEmo('happy',true);SND.hello();say('Привет! Я включился',3000,true);
  if(stream.getAudioTracks().length)startEars(stream);
  if(stream.getVideoTracks().length)startEyes(stream);
  startSpeechRec();};

function startEars(stream){if(!ac)return;let an;
  try{const src=ac.createMediaStreamSource(new MediaStream(stream.getAudioTracks()));an=ac.createAnalyser();an.fftSize=1024;src.connect(an)}catch(e){return}
  const buf=new Float32Array(an.fftSize);let loud=0,ambient=.02;
  setInterval(()=>{an.getFloatTimeDomainData(buf);let sum=0;for(let i=0;i<buf.length;i++)sum+=buf[i]*buf[i];
    const rms=Math.sqrt(sum/buf.length);
    if(Date.now()<selfSound){loud=0;return}
    const thr=Math.max(.18,ambient*5);if(rms<thr)ambient=ambient*.98+rms*.02;
    loud=rms>thr?loud+1:0;
    if(loud>=3&&!hurt()){loud=0;yell()}},100);}

/* ---------- recognising the owner's face ---------- */
let faceReady=false,who='',greetAt=0,enroll=0,lastStranger=0;
mem.faces=mem.faces||[];
function greet(w){lastInput=Date.now();
  if(w==='owner'){setEmo('happy',true);SND.hello();say(mem.name+'! Я тебя узнал!',3500,true)}
  else if(w==='stranger'){if(Date.now()-lastStranger<30000)return;lastStranger=Date.now();setEmo('surprised',true);SND.where();say('Ой… а ты кто? Я тебя не знаю',4000,true)}
  else{setEmo('happy',true);SND.hello();say('Привет! Я тебя вижу',3000,true)}
  setTimeout(()=>{if(emo==='happy'||emo==='surprised')setEmo('normal',true)},3500)}
function dist(a,b){let s=0;for(let i=0;i<a.length;i++){const d=a[i]-b[i];s+=d*d}return Math.sqrt(s)}
function loadScript(src){return new Promise((ok,no)=>{const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=no;document.head.appendChild(e)})}
async function startRecognition(v){const B='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13';
  try{await loadScript(B+'/dist/face-api.js');const M=B+'/model/';
    await faceapi.nets.tinyFaceDetector.loadFromUri(M);await faceapi.nets.faceLandmark68Net.loadFromUri(M);await faceapi.nets.faceRecognitionNet.loadFromUri(M);
  }catch(e){status('👁 вижу, но узнавать пока не умею');return}
  faceReady=true;if(!mem.faces.length)enroll=6;
  const opt=new faceapi.TinyFaceDetectorOptions({inputSize:224,scoreThreshold:.5});
  let busy=false;
  setInterval(async()=>{if(busy||!seen||v.readyState<2||document.hidden||emo==='sleep')return;busy=true;
    try{const r=await faceapi.detectSingleFace(v,opt).withFaceLandmarks().withFaceDescriptor();
      if(r){const d=Array.from(r.descriptor,x=>Math.round(x*1000)/1000);
        if(enroll>0){if(enroll===6){setEmo('surprised',true);say('Посмотри на меня… запоминаю твоё лицо',4000,true)}
          mem.faces.push(d);if(mem.faces.length>12)mem.faces.shift();enroll--;save();status('👁 запоминаю лицо… '+(6-enroll)+'/6');
          if(enroll===0){setEmo('love');say('Запомнил! Теперь я узнаю тебя, '+mem.name+' 💗',4500,true);who='owner';greetAt=0}}
        else{const best=Math.min(...mem.faces.map(f=>dist(f,d)));
          const w=best<.5?'owner':best>.6?'stranger':'';
          if(w){who=w;status(w==='owner'?'👁 вижу '+mem.name:'👁 вижу незнакомца')}}}
    }catch(e){}busy=false},1200);}
async function startEyes(stream){const v=$('cam');v.srcObject=new MediaStream(stream.getVideoTracks());
  try{await v.play()}catch(e){}
  let det=null;status('👁 учусь видеть…');
  try{const base='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    const m=await import(base+'/vision_bundle.mjs');
    const fs=await m.FilesetResolver.forVisionTasks(base+'/wasm');
    det=await m.FaceDetector.createFromOptions(fs,{baseOptions:{modelAssetPath:'vendor/face.tflite'},runningMode:'VIDEO',minDetectionConfidence:.6});
  }catch(e){status('👁 зрение не загрузилось');return}
  status('👁 ищу тебя…');startRecognition(v);
  setInterval(()=>{if(v.readyState<2||document.hidden)return;const now=Date.now();
    let r;try{r=det.detectForVideo(v,performance.now())}catch(e){return}
    const d=r&&r.detections&&r.detections[0];
    if(d){const b=d.boundingBox,x=1-2*(b.originX+b.width/2)/v.videoWidth,y=2*(b.originY+b.height/2)/v.videoHeight-1;
      const wasGone=!seen&&now-lastSeen>6000;seen=true;lastSeen=now;status('👁 вижу тебя');
      if(emo==='sleep'||hurt())return;
      if(!touching){gazeHold=now;look(Math.max(-1,Math.min(1,x*1.3)),Math.max(-1,Math.min(1,y)))}
      if(wasGone){who='';greetAt=now;}
      if(greetAt&&!alarm&&!working&&(who||now-greetAt>(faceReady?5000:2500))){const w=who;greetAt=0;greet(w)}
    }else if(seen&&now-lastSeen>4000){seen=false;status('👁 не вижу тебя');
      if(emo!=='sleep'&&!hurt()&&!alarm&&!working){setEmo('sad',true);SND.where();say('Ты где?..',3000);
        setTimeout(()=>emo==='sad'&&setEmo('normal',true),4000)}}
  },160);}

const ear=t=>{$('ear').textContent=t};
function startSpeechRec(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition,b=$('b-mic');
  if(!SR){ear('👂 в этом браузере я не понимаю слова — открой меня в Safari');return}
  const r=new SR();let want=true,timer=null,lastText='',lastAt=0;r.lang='ru-RU';r.continuous=true;r.interimResults=true;
  const paint=()=>{b.classList.toggle('on',want);b.textContent=want?'🎤 Слушаю…':'🎤 Слушай';ear(want?'👂 слушаю…':'👂 не слушаю')};
  const take=(text,final)=>{text=text.trim();if(!text)return;const now=Date.now();
    if(text===lastText&&now-lastAt<4000)return;lastText=text;lastAt=now;
    ear('👂 услышал: «'+text+'»');if(now>selfSound)heard(text);
    if(!final){try{r.abort()}catch(e){}}};
  r.onresult=e=>{const res=e.results[e.results.length-1],text=res[0].transcript;clearTimeout(timer);
    if(res.isFinal)take(text,true);else{ear('👂 '+text+'…');timer=setTimeout(()=>take(text,false),1300)}};
  r.onend=()=>{if(want)setTimeout(()=>{try{r.start()}catch(e){}},500)};
  r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){want=false;paint();ear('👂 микрофон запрещён — разреши его в настройках сайта')}};
  b.hidden=false;paint();b.onclick=()=>{want=!want;paint();try{want?r.start():r.stop()}catch(e){}};
  try{r.start()}catch(e){}}
(async()=>{
  if(!window.claude||!window.claude.use)return;
  try{tts=await window.claude.use('tts')}catch(e){}
  let d=null;try{d=await window.claude.use('dictation')}catch(e){}
  if(!d)return;
  const b=$('b-mic');b.hidden=false;let on=false;
  d.onFinal(({text})=>heard(text));
  d.onState(({state})=>{on=state==='listening';b.classList.toggle('on',on);b.textContent=on?'🎤 Слушаю…':'🎤 Слушай'});
  b.onclick=()=>{if(on){d.stop().catch(()=>{})}else{d.start().catch(e=>{if(e&&e.code==='not_granted')b.hidden=true})}};
})();

(async()=>{try{await navigator.wakeLock?.request('screen')}catch(e){}})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)navigator.wakeLock?.request('screen').catch(()=>{})});
</script>
